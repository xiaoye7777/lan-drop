<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>内网快传</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <!-- 登录页 -->
    <main id="login-view" class="login" hidden>
      <form id="login-form" class="login-card">
        <img class="login-logo" src="/icon.svg" alt="" width="44" height="44" />
        <h1>内网快传</h1>
        <p class="login-hint">组内传文件和发消息，打开网页就能用</p>
        <label class="field">
          <span>昵称</span>
          <input id="login-name" name="name" maxlength="20" autocomplete="nickname" required autofocus />
        </label>
        <label class="field">
          <span>访问口令</span>
          <input id="login-code" name="code" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button id="login-submit" class="btn btn-primary btn-block" type="submit">进入</button>
      </form>
    </main>

    <!-- 主界面 -->
    <div id="workspace-view" class="workspace" hidden>
      <aside class="sidebar">
        <header class="sidebar-head">
          <img src="/icon.svg" alt="" width="26" height="26" />
          <strong>内网快传</strong>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深浅色" title="切换深浅色">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 2v14a7 7 0 0 1 0-14Z" />
            </svg>
          </button>
        </header>
        <nav id="conversations" class="conversations" aria-label="会话列表"></nav>
        <button id="profile-button" class="profile-button" type="button" title="修改昵称或退出登录"></button>
      </aside>

      <section id="chat" class="chat" aria-labelledby="chat-title">
        <header class="chat-head">
          <h1 id="chat-title"></h1>
          <p id="chat-subtitle"></p>
        </header>
        <div id="connection-banner" class="banner" role="status" hidden>连接已断开，正在重新连接…</div>
        <div id="messages" class="messages" role="log" aria-live="polite" tabindex="0"></div>

        <form id="composer" class="composer">
          <label class="icon-btn attach-btn" title="选择文件">
            <input id="file-input" type="file" multiple aria-label="选择要发送的文件" />
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m20.5 11.5-8.6 8.6a5.3 5.3 0 0 1-7.5-7.5l8.6-8.6a3.5 3.5 0 0 1 5 5l-8.6 8.6a1.8 1.8 0 0 1-2.5-2.5l7.9-7.9"
              />
            </svg>
          </label>
          <textarea id="message-input" rows="1" maxlength="5000" aria-label="输入消息"></textarea>
          <button id="send-button" class="btn btn-primary" type="submit">发送</button>
        </form>

        <div id="drop-overlay" class="drop-overlay" hidden>
          <div id="drop-text" class="drop-text"></div>
        </div>
      </section>
    </div>

    <!-- 个人设置 -->
    <dialog id="profile-dialog" class="dialog">
      <form id="profile-form" method="dialog">
        <h2>个人设置</h2>
        <label class="field">
          <span>昵称</span>
          <input id="profile-name" maxlength="20" required />
        </label>
        <p id="profile-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="logout-button" class="btn btn-ghost btn-danger" type="button">退出登录</button>
          <span class="spacer"></span>
          <button id="profile-cancel" class="btn btn-ghost" type="button">取消</button>
          <button class="btn btn-primary" type="submit" value="save">保存</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="alert" hidden></div>
  </body>
</html>
