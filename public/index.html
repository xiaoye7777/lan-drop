<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>内网快传</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <!-- 登录页 -->
    <main id="login-view" class="login" hidden>
      <form id="login-form" class="login-card">
        <img class="login-logo" src="/icon.svg" alt="" width="44" height="44" />
        <h1>内网快传</h1>
        <p class="login-hint">组内传文件和发消息，打开网页就能用</p>
        <label class="field">
          <span>昵称</span>
          <input id="login-name" class="input" name="name" maxlength="20" autocomplete="nickname" required autofocus />
        </label>
        <label class="field">
          <span>访问口令</span>
          <input id="login-code" class="input" name="code" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button id="login-submit" class="btn btn-primary btn-block" type="submit">进入</button>
        <p id="login-insecure" class="login-insecure" hidden></p>
      </form>
    </main>

    <!-- 主界面 -->
    <div id="workspace-view" class="workspace" hidden>
      <aside class="sidebar">
        <header class="sidebar-head">
          <img src="/icon.svg" alt="" width="26" height="26" />
          <strong>内网快传</strong>
          <button id="insecure-badge" class="insecure-badge" type="button" hidden>未加密</button>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深浅色" title="切换深浅色">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 2v14a7 7 0 0 1 0-14Z" />
            </svg>
          </button>
        </header>
        <nav id="conversations" class="conversations" aria-label="会话列表"></nav>
        <button id="storage-meter" class="storage-meter" type="button" title="存储空间：查看和清理文件"></button>
        <button id="profile-button" class="profile-button" type="button" title="个人主页"></button>
      </aside>

      <section id="chat" class="chat" aria-labelledby="chat-title">
        <header class="chat-head">
          <div class="chat-head-text">
            <button id="chat-title" class="chat-title" type="button" title="查看资料"></button>
            <p id="chat-subtitle"></p>
          </div>
          <button id="search-button" class="icon-btn" type="button" aria-label="搜索聊天记录" title="搜索聊天记录">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="m15.5 15.5 5 5" />
              </g>
            </svg>
          </button>
        </header>
        <div id="connection-banner" class="banner" role="status" hidden>连接已断开，正在重新连接…</div>
        <div id="storage-banner" class="banner" role="status" hidden></div>
        <div id="messages" class="messages" role="log" aria-live="polite" tabindex="0"></div>

        <!-- 输入栏上方弹出的面板：表情、更多功能、特效 -->
        <div id="composer-popovers" class="composer-popovers">
          <div id="more-menu" class="popover menu more-menu" hidden></div>
          <div id="effect-menu" class="popover menu effect-menu" hidden></div>
        </div>

        <form id="composer" class="composer">
          <button id="sticker-button" class="icon-btn" type="button" aria-label="表情" aria-expanded="false" title="表情">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M8 14.5c1 1.4 2.3 2 4 2s3-.6 4-2" />
              </g>
              <circle cx="9" cy="10" r="1.3" fill="currentColor" />
              <circle cx="15" cy="10" r="1.3" fill="currentColor" />
            </svg>
          </button>
          <label class="icon-btn attach-btn" title="发送文件">
            <input id="file-input" type="file" multiple aria-label="选择要发送的文件" />
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m20.5 11.5-8.6 8.6a5.3 5.3 0 0 1-7.5-7.5l8.6-8.6a3.5 3.5 0 0 1 5 5l-8.6 8.6a1.8 1.8 0 0 1-2.5-2.5l7.9-7.9"
              />
            </svg>
          </label>
          <button id="more-button" class="icon-btn" type="button" aria-label="投票、接龙、大转盘、五子棋" aria-expanded="false" title="更多">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v8M8 12h8" />
              </g>
            </svg>
          </button>
          <div class="composer-input">
            <div id="reply-chip" class="effect-chip reply-chip" hidden></div>
            <div id="effect-chip" class="effect-chip" hidden></div>
            <textarea id="message-input" rows="1" maxlength="5000" aria-label="输入消息"></textarea>
          </div>
          <button id="effect-button" class="icon-btn" type="button" aria-label="消息特效" aria-expanded="false" title="消息特效">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M11 2.5 12.6 8l5.4 1.6-5.4 1.6L11 16.6 9.4 11.2 4 9.6 9.4 8 11 2.5Zm7.5 10 .8 2.4 2.2.7-2.2.7-.8 2.4-.8-2.4-2.2-.7 2.2-.7.8-2.4Z"
              />
            </svg>
          </button>
          <button id="send-button" class="btn btn-primary" type="submit">发送</button>
        </form>

        <!-- 多选消息时代替输入栏 -->
        <div id="select-bar" class="select-bar" hidden>
          <span id="select-count" class="select-count"></span>
          <span class="spacer"></span>
          <button id="forward-merge" class="btn btn-primary" type="button">合并转发</button>
          <button id="forward-single" class="btn btn-ghost" type="button">逐条转发</button>
          <button id="select-cancel" class="btn btn-ghost" type="button">取消</button>
        </div>

        <div id="drop-overlay" class="drop-overlay" hidden>
          <div id="drop-text" class="drop-text"></div>
        </div>
      </section>
    </div>

    <!-- 全屏特效的画布，平时隐藏，不挡鼠标 -->
    <canvas id="effects-canvas" class="effects-canvas" hidden aria-hidden="true"></canvas>
    <div id="toast" class="toast" role="alert" hidden></div>
  </body>
</html>
